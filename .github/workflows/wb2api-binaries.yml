name: wb2api-binaries

# Go 账号服务（toolbox/）二进制构建/发布：
#   - PR / push main -> 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push wb2api-v* tag -> 同上 + 打包上传到 GitHub Release
# 固化的发布纪律：-s -w 剥离、二进制版本串 == 源码 appVersion、tag 版本 == 源码版本
# （发布演练用 wb2api-v*-ci 后缀的 tag 豁免一致性断言）。
on:
  push:
    branches: [main]
    tags: ["wb2api-v*"]
  pull_request:
    paths:
      - "toolbox/go.mod"
      - "toolbox/go.sum"
      - "toolbox/cmd/**"
      - "toolbox/internal/**"
      - "toolbox/web/**"
      - "toolbox/config.example.json"
      - ".github/workflows/wb2api-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: toolbox/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/web/package-lock.json
      - name: Build Vue account panel
        working-directory: toolbox/web
        run: npm ci && npm run build
      - name: Check embedded frontend is current
        run: git diff --exit-code -- internal/panel/accounts_dist
      # ubuntu runner 自带 node，面板包的 JS 运行时冒烟测试会真实执行。
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: toolbox/go.mod

      - name: Read source version
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: Build (strip symbols, matching local release flags)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）。
      - name: Assert binary version string
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: Package (windows=zip triple, others=tar.gz)
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: toolbox/${{ env.name }}
          retention-days: 7

  # 由 wb2api-v* tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）-> 汇总资产 -> 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/wb2api-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: Assert tag matches source version
        working-directory: toolbox
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"
          TAG="${GITHUB_REF_NAME#wb2api-v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: Previous tag (compare link)
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
