name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Verify committed Plugin bundles
        run: git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js

      - name: Check types
        run: pnpm -r check

      - name: Verify GitHub plugin bundle
        run: |
          node scripts/verify-dsh-plugin.mjs

      - name: Run tests
        run: pnpm -r test

      - name: Build workspace
        run: NODE_ENV=production pnpm --workspace-concurrency=1 -r build

      - name: Verify production Plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs

      - name: Verify packed Host WebRTC fallback and installation closure
        run: node scripts/verify-packed-webrtc.mjs

  xfs-refresh:
    name: Test credential locks on XFS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' -r build
      - name: Mount local XFS
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          truncate -s 512M "$RUNNER_TEMP/refresh-xfs.img"
          sudo mkfs.xfs -f "$RUNNER_TEMP/refresh-xfs.img"
          mkdir "$RUNNER_TEMP/refresh-xfs"
          sudo mount -o loop "$RUNNER_TEMP/refresh-xfs.img" "$RUNNER_TEMP/refresh-xfs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/refresh-xfs"
          findmnt -T "$RUNNER_TEMP/refresh-xfs" -o FSTYPE
          touch "$RUNNER_TEMP/refresh-xfs/source"
          ln "$RUNNER_TEMP/refresh-xfs/source" "$RUNNER_TEMP/refresh-xfs/linked"
      - name: Run refresh and migration tests on XFS
        run: pnpm --dir packages/plugin exec vitest run tests/server-credentials.test.ts tests/identity-store.test.ts
        env:
          TMPDIR: ${{ runner.temp }}/refresh-xfs

  plugin-package:
    name: Package npm plugin
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Pack npm packages
        run: |
          mkdir -p artifacts/packages/root artifacts/packages/workspace
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages/root"

          for package_json in packages/*/package.json; do
            package_dir="${package_json%/package.json}"
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages/workspace"
          done

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: remote-session-plugin-packages-${{ github.sha }}
          path: artifacts/packages/**/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Build browser extension
        run: NODE_ENV=production pnpm --dir apps/browser build

      - name: Package browser extension
        run: |
          mkdir -p artifacts/browser
          cd apps/browser
          zip -qr "$GITHUB_WORKSPACE/artifacts/browser/remote-session-plugin-browser-${GITHUB_SHA}.zip" \
            manifest.json popup.html styles.css media _locales dist

      - name: Upload browser extension
        uses: actions/upload-artifact@v7
        with:
          name: remote-session-plugin-browser-${{ github.sha }}
          path: artifacts/browser/remote-session-plugin-browser-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

  server-image:
    name: Build Server container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
