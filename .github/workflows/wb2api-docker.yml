name: wb2api-docker

# Go 账号服务多架构镜像（amd64/arm64）自动构建并发布到 ghcr.io：
#   - push 到 main / 打 wb2api-v* tag / 手动触发 -> 构建并推送
#   - PR 触达构建相关文件 -> 仅构建验证，不推送
# tag 说明：main 接 latest + main + sha-xxxxxx；wb2api-v1.13.0 接 1.13.0 / 1.13
on:
  push:
    branches: [main]
    tags: ["wb2api-v*"]
  pull_request:
    paths:
      - "toolbox/Dockerfile"
      - "toolbox/.dockerignore"
      - "toolbox/go.mod"
      - "toolbox/go.sum"
      - "toolbox/cmd/**"
      - "toolbox/internal/**"
      - "toolbox/scripts/**"
      - "toolbox/*.sh"
      - "toolbox/config.example.json"
      - ".github/workflows/wb2api-docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # 合并后的仓库同时发布 DSH 插件，镜像名加 -wb2api 后缀区分服务。
  IMAGE_NAME: ${{ github.repository }}-wb2api

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=match,pattern=wb2api-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=wb2api-v(\d+\.\d+),group=1
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: toolbox
          file: toolbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
